<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />

    <!-- viewport-fit=cover: la app se mete bajo la barra de estado y el gesto
         de Android; el CSS lo compensa con env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Julian App</title>
    <meta name="description" content="Controla tus cuentas, tus gastos y tus pagos del mes." />

    <!-- El color de la barra del navegador sigue al tema. El store lo reescribe
         cuando el usuario cambia de tema a mano. -->
    <meta name="theme-color" content="#f4ebda" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Julian" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
